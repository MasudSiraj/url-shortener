spring:
  application:
    name: url-shortener
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never by Hibernate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

shortener:
  base-url: http://localhost:8080
  generator: random          # random | sequence  (ADR-002)
  code-length: 7
  collision-retries: 3
  cache:
    max-size: 10000
    ttl: 10m
  analytics:
    ip-hash-salt: ${SHORTENER_IP_SALT:dev-only-salt-change-me}
  rate-limit:
    enabled: true
    create-per-minute: 10      # POST /api/v1/urls        (docs/06 Q7)
    redirect-per-minute: 100   # GET /{code} and other reads
    max-tracked-clients: 100000
