spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:shortener}
    username: ${DB_USER:shortener}
    password: ${DB_PASSWORD:shortener}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
shortener:
  base-url: ${SHORTENER_BASE_URL:http://localhost:8080}
