name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'   # nightly dependency scan
  workflow_dispatch:

jobs:
  build:
    name: Build, test and gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Spotless -> Checkstyle -> unit -> integration (Testcontainers) -> JaCoCo threshold.
      # Docker is available on ubuntu-latest, so Testcontainers needs no extra setup.
      - name: Verify
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/

  # Engineer decision (docs/07): the NVD download makes this job slow on a cold cache, so it runs
  # nightly and on demand rather than on every push. It still fails the build on CVSS >= 7.
  dependency-check:
    name: OWASP dependency-check (fails on CVSS >= 7)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The NVD database download is slow; cache it between runs.
      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      # Finding S-10 (docs/08): engineer decision — a CVSS >= 7 finding fails the build.
      - name: Dependency vulnerability scan
        run: mvn -B dependency-check:check -DfailBuildOnCVSS=7 -DskipTests

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t url-shortener:ci .
